name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "GitHub runner Android SDK was not found in ANDROID_HOME or ANDROID_SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using preinstalled Android SDK at: $SDK_ROOT"
          ls -la "$SDK_ROOT/platforms"
          ls -la "$SDK_ROOT/build-tools"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android-wrapper
        run: gradle assembleRelease
      - name: Create temporary signing key
        working-directory: android-wrapper
        run: |
          keytool -genkeypair -v -keystore astro-upload.jks -storepass tempPass123! -keypass tempPass123! -alias astro -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Astro Bhagya Vidhata, OU=App, O=Astro, L=India, ST=India, C=IN"
      - name: Sign APK
        working-directory: android-wrapper
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks astro-upload.jks --ks-pass pass:tempPass123! --key-pass pass:tempPass123! --out Astro-Bhagya-Vidhata.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify Astro-Bhagya-Vidhata.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Bhagya-Vidhata-APK
          path: android-wrapper/Astro-Bhagya-Vidhata.apk
          retention-days: 30
