name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android-wrapper
        run: gradle assembleRelease
      - name: Create temporary signing key
        working-directory: android-wrapper
        run: |
          keytool -genkeypair -v -keystore astro-upload.jks -storepass tempPass123! -keypass tempPass123! -alias astro -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Astro Bhagya Vidhata, OU=App, O=Astro, L=India, ST=India, C=IN"
      - name: Sign APK
        working-directory: android-wrapper
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks astro-upload.jks --ks-pass pass:tempPass123! --key-pass pass:tempPass123! --out Astro-Bhagya-Vidhata.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify Astro-Bhagya-Vidhata.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Bhagya-Vidhata-APK
          path: android-wrapper/Astro-Bhagya-Vidhata.apk
          retention-days: 30
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: Astro Bhagya Vidhata Android App
          body: Install the APK directly on an Android phone.
          target_commitish: main
          files: android-wrapper/Astro-Bhagya-Vidhata.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
