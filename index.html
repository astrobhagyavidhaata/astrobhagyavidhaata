<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17112b">
  <title>Astro Bhagya Vidhata</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #100d1c;
      color: #fff;
    }
    header {
      padding: 22px 16px;
      text-align: center;
      background: #211638;
      border-bottom: 1px solid #493568;
    }
    header h1 { margin: 0; color: #f5c66b; font-size: 25px; }
    header p { margin: 8px 0 0; color: #d4c9e5; }
    main { max-width: 600px; margin: 25px auto; padding: 16px; }
    .panel {
      background: #211a32;
      border: 1px solid #493568;
      border-radius: 15px;
      padding: 20px;
    }
    h2 { color: #f5c66b; margin-top: 0; }
    label { display: block; margin: 15px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #66547f;
      background: #151020;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #e8b957;
      color: #211638;
      font-size: 17px;
      font-weight: bold;
    }
    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #151020;
      color: #f5d994;
      line-height: 1.6;
      display: none;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #a99bbd;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔱 Astro Bhagya Vidhata</h1>
    <p>वैदिक ज्योतिष एवं कुंडली परामर्श</p>
  </header>

  <main>
    <section class="panel">
      <h2>अपनी जन्म जानकारी भरें</h2>

      <form id="kundliForm">
        <label for="name">नाम</label>
        <input id="name" name="name" type="text"
          placeholder="अपना नाम लिखें" required>

        <label for="dob">जन्म तारीख</label>
        <input id="dob" name="dob" type="date" required>

        <label for="birthTime">जन्म समय</label>
        <input id="birthTime" name="birthTime" type="time" required>

        <label for="birthPlace">जन्म स्थान</label>
        <input id="birthPlace" name="birthPlace" type="text"
          placeholder="शहर या गाँव का नाम" required>

        <button type="submit">मेरी कुंडली बनाएं</button>
      </form>

      <div id="message" role="status"></div>
    </section>
  </main>

  <footer>
    © 2026 Astro Bhagya Vidhata
    <br>परामर्श शुल्क प्रस्तावित: ₹5 प्रति मिनट
  </footer>

  <script src="kundli.js"></script>
  <script src="wallet.js"></script>
  <script src="ai_chat.js"></script>
  <script src="gochar.js"></script>
</body>
</html>
